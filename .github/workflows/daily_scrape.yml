name: Daily South Milwaukee Agenda Scraper

on:
  schedule:
    # Runs every day at 12:00 UTC (7:00 AM Central Time)
    - cron: '0 12 * * *'
  workflow_dispatch: # Enables a manual run button

permissions:
  contents: write

jobs:
  scrape-and-summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai requests beautifulsoup4

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python monitor_agenda.py

      - name: Commit and Push New Briefings
        run: |
          git config --global user.name 'CivicBot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add briefings/ processed_meetings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: new meeting briefings" && git push)
